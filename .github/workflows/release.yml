# Release: on a version tag (v1.2.3), build and test like CI, publish the single exe with its SHA-256 and create a
# DRAFT GitHub release. Check the draft, then publish it by hand. The app's opt-in update check only sees published
# releases. The tag must match <Version> in src/Optimizer.App/Optimizer.App.csproj.

name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install .NET 10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Tag matches the app version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content src/Optimizer.App/Optimizer.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ("v$version" -ne $env:TAG) { Write-Error "Tag $env:TAG does not match <Version>$version</Version> in Optimizer.App.csproj"; exit 1 }

    - name: Restore
      run: dotnet restore PCOptimizer.sln

    - name: Build
      run: dotnet build PCOptimizer.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test PCOptimizer.sln --configuration Release --no-build --filter "Category!=Hardware"

    - name: Publish single exe
      run: dotnet publish src/Optimizer.App -p:PublishProfile=SingleFile

    # Code signing (Azure Trusted Signing or an OV certificate) goes here, before the checksum.

    - name: Checksum
      shell: pwsh
      run: |
        $hash = (Get-FileHash artifacts/publish/PCOptimizer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  PCOptimizer.exe" | Set-Content -Encoding ascii artifacts/publish/PCOptimizer.exe.sha256
        "SHA-256: $hash" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

    - name: Draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create $env:TAG artifacts/publish/PCOptimizer.exe artifacts/publish/PCOptimizer.exe.sha256 --draft --title "PCOptimizer $env:TAG" --generate-notes
