# Release: on a version tag (v1.2.3) of a commit on main, build and test like CI, publish the single exe, have SignPath
# sign it (once the repository variable SIGNPATH_ORGANIZATION_ID is set), sign its SHA-256 for the in-app update,
# attest its build provenance and create a DRAFT GitHub release. Check the draft, then publish it by hand. The app's
# opt-in update check only sees published releases. The tag must match <Version> in src/Optimizer.App/Optimizer.App.csproj.
#
# Two jobs on purpose: the build job runs third-party package code (restore, build, tests) with a read-only token and
# without the signing key; only the release job, which runs no project code, gets write access and the key.
# Actions are pinned to commit SHAs; to update one, look up the new tag's commit (gh api repos/<action>/commits/<tag> --jq .sha).

name: Release

on:
  push:
    tags: [ "v*.*.*" ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TAG: ${{ github.ref_name }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Tag is on main
      shell: pwsh
      run: |
        git merge-base --is-ancestor $env:GITHUB_SHA origin/main
        if ($LASTEXITCODE -ne 0) { Write-Error "Tag $env:TAG does not point to a commit on main"; exit 1 }

    - name: Tag matches the app version
      shell: pwsh
      run: |
        $version = ([xml](Get-Content src/Optimizer.App/Optimizer.App.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
        if ("v$version" -ne $env:TAG) { Write-Error "Tag $env:TAG does not match <Version>$version</Version> in Optimizer.App.csproj"; exit 1 }

    # global.json pins the SDK exactly: a release must not ship a runtime that misses Microsoft's latest fixes.
    - name: SDK is the newest patch
      shell: pwsh
      run: ./scripts/check-sdk-current.ps1

    - name: Install .NET (version from global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore Tunero.sln --locked-mode

    - name: Build
      run: dotnet build Tunero.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test Tunero.sln --configuration Release --no-build --filter "Category!=Hardware"

    - name: Publish single exe
      run: dotnet publish src/Optimizer.App -p:PublishProfile=SingleFile

    # SignPath signs this artifact in the release job and checks that it came from this run on GitHub's runners.
    - name: Upload exe
      id: upload
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-exe
        path: artifacts/publish/Tunero.exe
        if-no-files-found: error
        retention-days: 3

  release:
    needs: build
    runs-on: windows-2025
    # The SignPath request below may wait up to 4 hours for the owner's approval.
    timeout-minutes: 270
    # The signing key is a secret of this environment, not of the repository: only jobs that name the environment
    # get it, and the environment allows only v*.*.* tags and waits for the owner's approval. A workflow on another
    # branch or tag cannot read it.
    environment: release
    permissions:
      contents: write
      # SignPath reads the build job's details and downloads the unsigned artifact with this job's token.
      actions: read
      # Build provenance: a Sigstore certificate for this workflow run (id-token) and the attestation stored on GitHub.
      id-token: write
      attestations: write

    env:
      TAG: ${{ github.ref_name }}

    steps:
    - name: Download exe
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: release-exe
        path: release

    # Code signing by SignPath Foundation (CONTRIBUTING.md, Releases). Off until the repository variable
    # SIGNPATH_ORGANIZATION_ID is set; the API token is a secret of the release environment. The request waits for the
    # owner's approval in SignPath, so the timeout is generous. The parameter "version" is the version in the exe's
    # version resource ("1.2.3"), which .signpath/artifact-configuration.xml checks.
    - name: Version for SignPath
      if: vars.SIGNPATH_ORGANIZATION_ID != ''
      shell: pwsh
      run: |
        "VERSION=$($env:TAG.TrimStart('v'))" | Out-File -Encoding utf8 -Append $env:GITHUB_ENV

    - name: Sign exe (SignPath)
      id: sign
      if: vars.SIGNPATH_ORGANIZATION_ID != ''
      uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: Tunero
        signing-policy-slug: release-signing
        github-artifact-id: ${{ needs.build.outputs.artifact-id }}
        wait-for-completion: true
        wait-for-completion-timeout-in-seconds: 14400
        output-artifact-directory: signed
        parameters: |
          version: "${{ env.VERSION }}"

    - name: Use the signed exe
      if: steps.sign.outcome == 'success'
      shell: pwsh
      run: |
        $signature = Get-AuthenticodeSignature signed/Tunero.exe
        if ($signature.Status -ne 'Valid') { Write-Error "SignPath returned an exe without a valid signature: $($signature.Status)"; exit 1 }
        Move-Item signed/Tunero.exe release/Tunero.exe -Force
        "Signed by: $($signature.SignerCertificate.Subject)" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

    # Build provenance (SLSA) of the exe that is released, signed or not: names this repository, workflow, tag and commit.
    # Anyone can check a download with  gh attestation verify Tunero.exe --repo jozuern/Tunero
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: release/Tunero.exe

    # Only the public keys the app checks updates with and the changelog for the notes (no project code runs in this job).
    - name: Get the app's update keys and the changelog
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        sparse-checkout: |
          src/Optimizer.Core/Updates/update-key*.pem
          CHANGELOG.md
        sparse-checkout-cone-mode: false
        path: key
        persist-credentials: false

    - name: Checksum and update signature
      shell: pwsh
      env:
        UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
      run: |
        if (-not $env:UPDATE_SIGNING_KEY) { Write-Error "The UPDATE_SIGNING_KEY secret is missing (scripts/new-update-key.ps1)"; exit 1 }
        $hash = (Get-FileHash release/Tunero.exe -Algorithm SHA256).Hash.ToLowerInvariant()
        "$hash  Tunero.exe" | Set-Content -Encoding ascii release/Tunero.exe.sha256
        # Same statement as UpdateSignature.Statement: "PCOptimizer <version>\n<sha256>\n", signed with ECDSA P-256 and SHA-256.
        $version = $env:TAG.TrimStart('v')
        $statement = [System.Text.Encoding]::UTF8.GetBytes("PCOptimizer $version`n$hash`n")
        $ecdsa = [System.Security.Cryptography.ECDsa]::Create()
        try {
          $ecdsa.ImportFromPem($env:UPDATE_SIGNING_KEY)
          $signature = $ecdsa.SignData($statement, [System.Security.Cryptography.HashAlgorithmName]::SHA256)
        } finally { $ecdsa.Dispose() }
        # A secret from another key would ship a release every installed copy rejects: check against the app's keys (the
        # release key update-key.pem and the offline backup key update-key-backup.pem, used only if the first is lost).
        $matched = $false
        foreach ($pem in Get-ChildItem key/src/Optimizer.Core/Updates -Filter 'update-key*.pem') {
          $public = [System.Security.Cryptography.ECDsa]::Create()
          try {
            $public.ImportFromPem((Get-Content -Raw $pem.FullName))
            if ($public.VerifyData($statement, $signature, [System.Security.Cryptography.HashAlgorithmName]::SHA256)) { $matched = $true }
          } finally { $public.Dispose() }
        }
        if (-not $matched) { Write-Error "The signature matches none of the app's update keys: UPDATE_SIGNING_KEY is not the app's key"; exit 1 }
        [Convert]::ToBase64String($signature) | Set-Content -Encoding ascii release/Tunero.exe.sig
        "SHA-256: $hash" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

    - name: Draft release
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      # The notes are the version's section of CHANGELOG.md ("## 1.0.0" up to the next "## "): a release without one stops
      # here, so "Unreleased" is renamed before the tag, not forgotten.
      run: |
        $version = $env:TAG.TrimStart('v')
        $lines = Get-Content key/CHANGELOG.md
        $start = [Array]::FindIndex($lines, [Predicate[string]]{ param($l) $l -match ('^## ' + [regex]::Escape($version) + '( |$)') })
        if ($start -lt 0) { Write-Error "CHANGELOG.md has no section '## $version': rename 'Unreleased' to the version before tagging"; exit 1 }
        $end = [Array]::FindIndex($lines, $start + 1, [Predicate[string]]{ param($l) $l -match '^## ' })
        if ($end -lt 0) { $end = $lines.Count }
        ($lines[($start + 1)..($end - 1)] -join "`n").Trim() | Set-Content -Encoding utf8 notes.md
        gh release create $env:TAG release/Tunero.exe release/Tunero.exe.sha256 release/Tunero.exe.sig --draft --verify-tag --title "Tunero $env:TAG" --notes-file notes.md
