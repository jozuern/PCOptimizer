# Builds the website in website/ (Astro) and publishes it to GitHub Pages at https://tunero.dev.
# Runs when the site, the facts it reads (README counts, catalog, explanation pages, version) or this file change, after
# each release (so the version on the page follows the latest release), and on demand.
name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'README.md'
      - 'src/Optimizer.Core/Catalog/**'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A run started by a release runs on its tag, and the github-pages environment deploys only from main. The release
  # commit reached main before the release existed, so that build still read the previous version: start a run on main.
  # (workflow_dispatch is one of the events GITHUB_TOKEN may start a run with.)
  dispatch:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
    - name: Build again on main
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: website/package-lock.json

    - name: Install
      working-directory: website
      run: npm ci --ignore-scripts --no-audit --no-fund

    - name: Build
      working-directory: website
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reads the latest release for the version on the page
      run: npx astro build

    - name: Configure Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

    - name: Upload site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
