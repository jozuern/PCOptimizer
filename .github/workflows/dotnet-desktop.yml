# Build, test and publish PCOptimizer (WPF, .NET 10, Windows x64).
# Runs the unit tests (sandbox registry and fakes; nothing on the runner is changed) and the docs lint,
# then publishes the single self-contained exe and keeps it as a build artifact.
# Tests marked Category=Hardware read the real PC (Store apps, sensors, GPU driver) and only make sense on a
# gaming PC, not on the Windows Server runner: they are skipped here.
# Actions are pinned to commit SHAs; to update one, look up the new tag's commit (gh api repos/<action>/commits/<tag> --jq .sha).

name: Build and test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        fetch-depth: 2
        persist-credentials: false

    # Every commit on main raises the patch version (.githooks/pre-commit); a commit made without the hook fails here.
    - name: Version raised
      if: github.event_name == 'push'
      shell: pwsh
      run: |
        $csproj = "src/Optimizer.App/Optimizer.App.csproj"
        function Version($text) { if ($text -match '<Version>([0-9.]+)</Version>') { $Matches[1] } }
        $now = Version (Get-Content $csproj -Raw)
        $before = Version ((git show "HEAD~1:$csproj") -join "`n")
        if ($before -and $now -eq $before) { Write-Error "<Version> is still $now: enable the pre-commit hook (git config core.hooksPath .githooks)"; exit 1 }

    - name: Install .NET (version from global.json)
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore PCOptimizer.sln --locked-mode

    - name: Build
      run: dotnet build PCOptimizer.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test PCOptimizer.sln --configuration Release --no-build --filter "Category!=Hardware" --logger "trx;LogFileName=results.trx" --results-directory TestResults

    # Artifacts count against the account's storage quota: a full quota must not fail the build.
    - name: Upload test results
      if: failure()
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: test-results
        path: TestResults
        if-no-files-found: ignore
        retention-days: 7

    - name: Publish single exe
      run: dotnet publish src/Optimizer.App -p:PublishProfile=SingleFile

    - name: Upload exe
      continue-on-error: true
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: PCOptimizer-${{ github.sha }}
        path: artifacts/publish/PCOptimizer.exe
        if-no-files-found: error
        retention-days: 14
